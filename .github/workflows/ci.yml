name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A fixed published release: the GitHub API rate limit makes "latest" lookups flaky in CI.
      GITIX_VERSION: v0.1.0-beta.1
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: |
          GITIX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/gitix" --version
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:GITIX_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          gitix --version
